<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>B-SMART 4 - Bank Mini</title>

  <!-- PWA & Icons -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f2a5c">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="B-SMART 4">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f3f4f6; /* Warna background B-SMART 4 */
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- Ganti link di bawah ini dengan link Web App B-SMART 4 Anda -->
    <iframe src="https://script.google.com/macros/s/AKfycbyjseuDfBONWbn766jjvrROSYetUF9io9U-k6gpZtXi4S4LeT26Umct_Cgx50IJMU1ZoQ/exec" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </div>
  
  <script>
    // Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW terdaftar!', reg.scope))
          .catch(err => console.log('SW gagal!', err));
      });
    }
  </script>
</body>
</html>
